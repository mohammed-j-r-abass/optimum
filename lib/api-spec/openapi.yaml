    "/live/session": {
      "post": {
        "operationId": "createLiveSession",
        "tags": ["firststep"],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LiveSessionInput" } } } },
        "responses": { "200": { "description": "Short-lived Gemini Live credential; never cache", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LiveSessionResult" } } } } }
      }
    },
    "/live/{id}/transcript": {
      "post": {
        "operationId": "saveLiveTranscript",
        "tags": ["firststep"],
        "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "string" } }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LiveTranscriptBatchInput" } } } },
        "responses": { "200": { "description": "Saved, including duplicate retries", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LiveSaveResult" } } } } }
      }
    },
    "/live/{id}/close": {
