  "components": {
    "schemas": {
      "LiveSessionInput": {
        "type": "object",
        "required": ["targetId", "kind", "microphoneConsent"],
        "properties": {
          "targetId": { "type": "string", "minLength": 1, "maxLength": 100 },
          "kind": { "type": "string", "enum": ["interview", "application"] },
          "microphoneConsent": { "type": "boolean" }
        }
      },
      "LiveSessionResult": {
        "type": "object",
        "required": ["id", "token", "model", "expiresAt"],
        "properties": {
          "id": { "type": "string" }, "token": { "type": "string" },
          "model": { "type": "string" }, "expiresAt": { "type": "string" }
        }
      },
      "LiveTranscriptBatchInput": {
        "type": "object", "required": ["events"],
        "properties": {
          "events": {
            "type": "array", "minItems": 1, "maxItems": 20,
            "items": {
              "type": "object", "required": ["id", "role", "content"],
              "properties": {
                "id": { "type": "string", "minLength": 1, "maxLength": 100 },
                "role": { "type": "string", "enum": ["user", "assistant"] },
                "content": { "type": "string", "minLength": 1, "maxLength": 15000 },
                "partial": { "type": "boolean" }
              }
            }
          }
        }
      },
      "LiveSaveResult": {
        "type": "object", "required": ["success"],
        "properties": { "success": { "type": "boolean" } }
      },
      "HealthStatus": {
        "type": "object",
        "properties": {
          "status": {
            "type": "string"
          }
        },
        "required": [
          "status"
        ]
      },
      "Profile": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "phone": {
            "type": "string"
          },
          "location": {
            "type": "string"
          },
          "education": {
            "type": "string"
          },
          "experience": {
            "type": "string"
          },
          "skills": {
            "type": "string"
          },
          "goals": {
            "type": "string"
          }
        },
        "required": [
          "name",
          "email",
          "phone",
          "location",
          "education",
          "experience",
          "skills",
          "goals"
        ]
      },
      "Message": {
        "type": "object",
        "properties": {
          "role": {
            "type": "string"
          },
          "content": {
            "type": "string"
          }
        },
        "required": [
          "role",
          "content"
        ]
      },
      "ApplicationInput": {
        "type": "object",
        "properties": {
          "title": {
            "type": "string"
          },
          "company": {
            "type": "string"
          },
          "description": {
            "type": "string"
          }
        },
        "required": [
          "title",
          "company",
          "description"
        ]
      },
      "Application": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "company": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "cv": {
            "type": "string"
          },
          "advice": {
            "type": "string"
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Message"
            }
          },
          "createdAt": {
            "type": "string"
          },
          "cvDocument": {
            "$ref": "#/components/schemas/CvDocument"
          },
          "jobAnalysis": {
            "$ref": "#/components/schemas/JobAnalysis"
          }
        },
        "required": [
          "id",
          "title",
          "company",
          "description",
          "status",
          "cv",
          "advice",
          "messages",
          "createdAt"
        ]
      },
      "CoachInput": {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        },
        "required": [
          "message"
        ]
      },
      "InterviewInput": {
        "type": "object",
        "properties": {
          "applicationId": {
            "type": "string"
          },
          "stage": {
            "type": "string"
          },
          "scheduledAt": {
            "type": "string"
          }
        },
        "required": [
          "applicationId",
          "stage"
        ]
      },
      "Interview": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "applicationId": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "stage": {
            "type": "string"
          },
          "status": {
            "type": "string"
          },
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Message"
            }
          },
          "feedback": {
            "type": "string"
          },
          "score": {
            "type": [
              "number",
              "null"
            ]
          },
          "scheduledAt": {
            "type": "string"
          },
          "createdAt": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "applicationId",
          "title",
          "stage",
          "status",
          "messages",
          "feedback",
          "score",
          "scheduledAt",
          "createdAt"
        ]
      },
      "TurnInput": {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          },
          "image": {
            "type": "string"
          }
        },
        "required": [
          "message"
        ]
      },
      "Resource": {
        "type": "object",
        "properties": {
          "title": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "url": {
            "type": "string"
          },
          "category": {
            "type": "string"
          }
        },
        "required": [
          "title",
          "description",
          "url",
          "category"
        ]
      },
      "Dashboard": {
        "type": "object",
        "properties": {
          "profile": {
            "$ref": "#/components/schemas/Profile"
          },
          "applications": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Application"
            }
          },
          "interviews": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Interview"
            }
          },
          "profileCompletion": {
            "type": "number"
          },
          "nextStep": {
            "type": "string"
          }
        },
        "required": [
