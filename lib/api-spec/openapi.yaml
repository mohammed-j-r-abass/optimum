          "data"
        ]
      },
      "ImportResult": {
        "type": "object",
        "properties": {
          "text": {
            "type": "string"
          }
        },
        "required": [
          "text"
        ]
      },
      "VoiceInput": {
        "type": "object",
        "properties": {
          "audio": {
            "type": "string"
          },
          "context": {
            "type": "string"
          },
          "applicationId": {
            "type": "string"
          },
          "interviewId": {
            "type": "string"
          }
        },
        "required": [
          "audio",
          "context"
        ]
      },
      "VoiceResult": {
        "type": "object",
