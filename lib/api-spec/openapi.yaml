        },
        "required": [
          "audio",
          "transcript",
          "userTranscript"
        ]
      },
      "ResearchInput": {
        "type": "object",
        "properties": {
          "query": {
            "type": "string"
          }
        },
        "required": [
          "query"
        ]
      },
      "ResearchResult": {
        "type": "object",
        "properties": {
          "answer": {
            "type": "string"
          },
          "sources": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Resource"
            }
          }
        },
        "required": [
          "answer",
          "sources"
        ]
      },
      "LiveSession": {
        "type": "object",
        "required": [
          "token",
          "model",
          "sessionId",
          "expiresAt",
          "config"
        ],
        "properties": {
          "token": {
            "type": "string"
          },
          "model": {
            "type": "string"
          },
          "sessionId": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string"
          },
          "config": {
            "type": "string",
            "description": "JSON-encoded locked Gemini LiveConnectConfig"
          }
        }
      },
      "LiveTranscriptEvent": {
        "type": "object",
        "required": [
          "id",
          "role",
          "content"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "user",
              "assistant"
            ]
          },
          "content": {
            "type": "string"
          }
        }
      },
      "LiveTranscriptInput": {
        "type": "object",
        "required": [
          "sessionId",
          "events"
        ],
        "properties": {
          "sessionId": {
            "type": "string"
          },
          "events": {
            "type": "array",
            "items": {
