          "applications",
          "interviews",
          "profileCompletion",
          "nextStep"
        ]
      },
      "ImportInput": {
        "type": "object",
        "properties": {
          "name": {
            "type": "string"
          },
          "data": {
            "type": "string"
          }
        },
        "required": [
